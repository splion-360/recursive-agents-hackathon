  <path class="line green" d="M1512 548V440H572V272"/><circle cx="1497" cy="440" r="10" fill="#65a30d"/><text class="numText" x="1497" y="444" text-anchor="middle">12</text><text class="label" x="595" y="432" fill="#365314">active version</text>

  <rect class="plane" x="260" y="780" width="1080" height="166"/>
  <rect class="planeBar" x="260" y="780" width="1080" height="36" rx="14"/>
  <text class="planeTitle" x="280" y="803">OBSERVABILITY AND DEMO · NEVER AGENT CONTEXT</text>
  <g><rect x="330" y="848" width="220" height="66" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><ellipse cx="440" cy="848" rx="110" ry="10" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><text class="head" x="440" y="874" text-anchor="middle" fill="#334155">Experiment Trace</text><text class="sub" x="440" y="896" text-anchor="middle">local JSONL · append-only</text></g>
