<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 1170" role="img" aria-labelledby="diagramTitle diagramDesc">
  <title id="diagramTitle">Memory Distillation interview-style system design</title>
  <desc id="diagramDesc">Four planes show isolated H-star and Kappa calibration, online task execution, batched immutable improvement and promotion, and non-serving observability. Numbered orthogonal arrows show the evidence flow.</desc>
  <defs>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#65a30d"/></marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d97706"/></marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b91c1c"/></marker>
    <style>
      .canvas{fill:#f8fafc}.plane{fill:#fff;stroke:#94a3b8;stroke-width:2;rx:14}.planeBar{fill:#e2e8f0}.planeTitle{font:800 13px ui-monospace,monospace;letter-spacing:1.2px;fill:#334155}.box{stroke-width:2;rx:10}.head{font:700 15px Inter,Arial,sans-serif}.sub{font:12px Inter,Arial,sans-serif;fill:#475569}.tag{font:700 10px ui-monospace,monospace;letter-spacing:.5px}.line{fill:none;stroke:#475569;stroke-width:2.2;marker-end:url(#arrowSlate)}.green{stroke:#65a30d;marker-end:url(#arrowGreen)}.amber{stroke:#d97706;marker-end:url(#arrowAmber)}.red{stroke:#b91c1c;marker-end:url(#arrowRed)}.dash{stroke:#64748b;stroke-dasharray:7 6;marker-end:url(#arrowSlate)}.double{marker-start:url(#arrowSlate)}.label{font:11px Inter,Arial,sans-serif;fill:#334155;paint-order:stroke;stroke:#fff;stroke-width:5;stroke-linejoin:round}.num{fill:#334155}.numText{font:700 10px Inter,Arial,sans-serif;fill:#fff}.dbTop{stroke-width:2}.footer{font:700 13px Inter,Arial,sans-serif;fill:#365314}
    </style>
  </defs>
  <rect class="canvas" width="1640" height="1170"/>
  <text x="820" y="34" text-anchor="middle" style="font:700 25px Georgia,serif;fill:#173f38">Memory Distillation · System Design</text>
  <text x="820" y="58" text-anchor="middle" class="sub">Frozen calibration, reviewed execution, immutable Version N+1 promotion, and isolated observability</text>

  <rect class="plane" x="20" y="82" width="1600" height="148"/>
  <rect class="planeBar" x="20" y="82" width="1600" height="36" rx="14"/>
  <text class="planeTitle" x="40" y="105">CALIBRATION · DISJOINT 8 DISCOVERY + 8 REGRESSION · NO MEMORY WRITES</text>
  <rect class="box" x="45" y="145" width="190" height="58" fill="#dbeafe" stroke="#3b82f6"/><text class="head" x="140" y="170" text-anchor="middle" fill="#1e3a5f">Harness Calibration Set</text><text class="sub" x="140" y="190" text-anchor="middle">fixed · hashed · disjoint</text>
  <rect class="box" x="295" y="145" width="190" height="58" fill="#f3e8ff" stroke="#9333ea"/><text class="head" x="390" y="170" text-anchor="middle" fill="#581c87">H-star Proposal</text><text class="sub" x="390" y="190" text-anchor="middle">one bounded revision</text>
  <rect class="box" x="545" y="145" width="190" height="58" fill="#fee2e2" stroke="#dc2626"/><text class="head" x="640" y="170" text-anchor="middle" fill="#7f1d1d">Regression Gate</text><text class="sub" x="640" y="190" text-anchor="middle">deterministic evidence</text>
  <rect class="box" x="795" y="145" width="210" height="58" fill="#ffedd5" stroke="#d97706"/><text class="head" x="900" y="170" text-anchor="middle" fill="#7c2d12">Frozen Kappa Guidance</text><text class="sub" x="900" y="190" text-anchor="middle">answer-free · H-executable</text>
  <rect class="box" x="1065" y="136" width="510" height="76" fill="#ccfbf1" stroke="#0f766e"/><text class="tag" x="1080" y="155" fill="#0f766e">FIXED ROLE CONTRACT</text><text class="sub" x="1320" y="178" text-anchor="middle">Student: smallest verified Crusoe multimodal model · Reviewer: Nemotron</text><text class="sub" x="1320" y="197" text-anchor="middle">Consolidator: schema-reliable Crusoe text model</text>
  <path class="line" d="M235 174H295"/><text class="label" x="265" y="165" text-anchor="middle">discover</text>
  <path class="line" d="M485 174H545"/><text class="label" x="515" y="165" text-anchor="middle">evaluate</text>
  <path class="line amber" d="M735 174H795"/><text class="label" x="765" y="165" text-anchor="middle">adapt</text>
  <path class="line amber" d="M900 203V302"/><text class="label" x="913" y="250" fill="#9a3412">private guidance</text>

  <g transform="translate(0 180)">

  <rect class="plane" x="20" y="82" width="1600" height="348"/>
  <rect class="planeBar" x="20" y="82" width="1600" height="36" rx="14"/>
  <text class="planeTitle" x="40" y="105">ONLINE TASK EXECUTION</text>

  <rect class="box" x="45" y="190" width="150" height="72" fill="#dbeafe" stroke="#3b82f6"/><text class="tag" x="57" y="207" fill="#1d4ed8">CHARTQA</text><text class="head" x="120" y="231" text-anchor="middle" fill="#1e3a5f">Collection Item</text><text class="sub" x="120" y="250" text-anchor="middle">image + question</text>
  <rect class="box" x="235" y="180" width="190" height="92" fill="#ccfbf1" stroke="#0f766e"/><text class="tag" x="247" y="198" fill="#0f766e">CONTROL PLANE</text><text class="head" x="330" y="224" text-anchor="middle" fill="#134e4a">Experiment API</text><text class="sub" x="330" y="245" text-anchor="middle">FastAPI orchestrator</text><text class="sub" x="330" y="262" text-anchor="middle">mode · budgets · state</text>
  <rect class="box" x="485" y="180" width="175" height="92" fill="#e0f2fe" stroke="#0284c7"/><text class="tag" x="497" y="198" fill="#0369a1">MEMMACHINE API</text><text class="head" x="572" y="224" text-anchor="middle" fill="#0c4a6e">Memory Retriever</text><text class="sub" x="572" y="245" text-anchor="middle">filter · threshold · top-k</text>
  <rect class="box" x="720" y="180" width="180" height="92" fill="#dcfce7" stroke="#65a30d"/><text class="tag" x="732" y="198" fill="#3f6212">CRUSOE</text><text class="head" x="810" y="224" text-anchor="middle" fill="#365314">Student Agent</text><text class="sub" x="810" y="245" text-anchor="middle">multimodal model</text><text class="sub" x="810" y="262" text-anchor="middle">4 actions · max 8 steps</text>
  <rect class="box" x="850" y="122" width="190" height="56" fill="#ffedd5" stroke="#d97706"/><text class="tag" x="862" y="136" fill="#9a3412">CRUSOE · NEMOTRON</text><text class="head" x="945" y="157" text-anchor="middle" fill="#7c2d12">Reviewer Sidecar</text><text class="sub" x="945" y="173" text-anchor="middle">frozen Kappa · collection + C1</text>
  <rect class="box" x="985" y="180" width="180" height="92" fill="#fef3c7" stroke="#ca8a04"/><text class="tag" x="997" y="198" fill="#854d0e">POLICY BOUNDARY</text><text class="head" x="1075" y="224" text-anchor="middle" fill="#713f12">Action Gateway</text><text class="sub" x="1075" y="245" text-anchor="middle">schema · limits · routing</text>
  <rect class="box" x="1230" y="180" width="215" height="92" fill="#fef9c3" stroke="#d6b656"/><text class="tag" x="1242" y="198" fill="#665200">NEMOCLAW · OPENSHELL</text><text class="head" x="1337" y="224" text-anchor="middle" fill="#5f4b00">Python Sandbox</text><text class="sub" x="1337" y="245" text-anchor="middle">no network · scoped files</text><text class="sub" x="1337" y="262" text-anchor="middle">fixed timeout</text>
  <rect class="box" x="45" y="332" width="150" height="64" fill="#ede9fe" stroke="#8b5cf6"/><text class="tag" x="57" y="349" fill="#6d28d9">CHARTQA</text><text class="head" x="120" y="373" text-anchor="middle" fill="#4c1d95">Final Held-Out</text><text class="sub" x="120" y="390" text-anchor="middle">read once</text>
  <rect class="box" x="1230" y="322" width="215" height="76" fill="#fee2e2" stroke="#dc2626"/><text class="tag" x="1242" y="339" fill="#991b1b">DETERMINISTIC</text><text class="head" x="1337" y="362" text-anchor="middle" fill="#7f1d1d">C0-C3 Evaluator</text><text class="sub" x="1337" y="382" text-anchor="middle">paired stats · C3 availability</text>

  <path class="line" d="M195 226H235"/><circle class="num" cx="215" cy="211" r="10"/><text class="numText" x="215" y="215" text-anchor="middle">1</text>
  <path class="line" d="M425 226H485"/><circle class="num" cx="455" cy="211" r="10"/><text class="numText" x="455" y="215" text-anchor="middle">2</text>
  <path class="line" d="M660 226H720"/><circle class="num" cx="690" cy="211" r="10"/><text class="numText" x="690" y="215" text-anchor="middle">3</text>
  <path class="line green" d="M900 226H985"/><text class="label" x="943" y="218" text-anchor="middle">deploy</text>
  <path class="line amber" d="M810 180V144H850"/><text class="label" x="817" y="136" fill="#9a3412">review</text>
  <path class="line amber" d="M1040 144H1075V180"/><text class="label" x="1058" y="136" text-anchor="middle" fill="#9a3412">checked</text>
  <path class="line double" d="M1165 226H1230"/><circle class="num" cx="1197" cy="211" r="10"/><text class="numText" x="1197" y="215" text-anchor="middle">5</text><text class="label" x="1197" y="248" text-anchor="middle">action / observation</text>
  <path class="line red" d="M1075 272V360H1230"/><text class="label" x="1100" y="351" fill="#991b1b">final answer</text>
  <path class="line" d="M195 364H215V412H1337V398"/><text class="label" x="225" y="404" fill="#4c1d95">references</text>

  <rect class="plane" x="20" y="456" width="1600" height="292"/>
  <rect class="planeBar" x="20" y="456" width="1600" height="36" rx="14"/>
  <text class="planeTitle" x="40" y="479">BATCHED IMPROVEMENT AND PROMOTION · ONE IMMUTABLE CANDIDATE</text>
  <rect class="box" x="45" y="555" width="150" height="72" fill="#dcfce7" stroke="#65a30d"/><text class="tag" x="57" y="573" fill="#3f6212">CHARTQA</text><text class="head" x="120" y="597" text-anchor="middle" fill="#365314">Promotion Set</text><text class="sub" x="120" y="617" text-anchor="middle">validation only</text>
  <g><rect x="235" y="548" width="185" height="84" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/><ellipse cx="327.5" cy="548" rx="92.5" ry="12" fill="#bfdbfe" stroke="#3b82f6" stroke-width="2"/><text class="tag" x="247" y="569" fill="#1d4ed8">MEMMACHINE</text><text class="head" x="327" y="594" text-anchor="middle" fill="#1e3a5f">Reviewed Episodes</text><text class="sub" x="327" y="615" text-anchor="middle">actions · outcomes · provenance</text></g>
  <rect class="box" x="475" y="548" width="180" height="84" fill="#f3e8ff" stroke="#9333ea"/><text class="tag" x="487" y="566" fill="#7e22ce">CRUSOE</text><text class="head" x="565" y="590" text-anchor="middle" fill="#581c87">Consolidator</text><text class="sub" x="565" y="611" text-anchor="middle">abstract · merge · dedupe</text>
  <rect class="box" x="715" y="548" width="180" height="84" fill="#fee2e2" stroke="#dc2626"/><text class="tag" x="727" y="566" fill="#991b1b">DETERMINISTIC</text><text class="head" x="805" y="590" text-anchor="middle" fill="#7f1d1d">Contamination Screen</text><text class="sub" x="805" y="611" text-anchor="middle">answers · IDs · raw values</text>
  <g><rect x="955" y="548" width="180" height="84" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/><ellipse cx="1045" cy="548" rx="90" ry="12" fill="#e9d5ff" stroke="#9333ea" stroke-width="2"/><text class="tag" x="967" y="569" fill="#7e22ce">MEMMACHINE</text><text class="head" x="1045" y="594" text-anchor="middle" fill="#581c87">Candidate Version</text><text class="sub" x="1045" y="615" text-anchor="middle">immutable card manifest</text></g>
  <polygon points="1275,526 1380,590 1275,654 1170,590" fill="#dcfce7" stroke="#65a30d" stroke-width="2"/><text class="tag" x="1275" y="562" text-anchor="middle" fill="#3f6212">DETERMINISTIC</text><text class="head" x="1275" y="585" text-anchor="middle" fill="#365314">Promotion Gate</text><text class="sub" x="1275" y="606" text-anchor="middle">accuracy · regression</text><text class="sub" x="1275" y="623" text-anchor="middle">latency · tokens</text>
  <g><rect x="1430" y="548" width="165" height="84" rx="12" fill="#dcfce7" stroke="#65a30d" stroke-width="2"/><ellipse cx="1512.5" cy="548" rx="82.5" ry="12" fill="#bbf7d0" stroke="#65a30d" stroke-width="2"/><text class="tag" x="1442" y="569" fill="#3f6212">MEMMACHINE</text><text class="head" x="1512" y="594" text-anchor="middle" fill="#365314">Accepted Version</text><text class="sub" x="1512" y="615" text-anchor="middle">active pointer · read-only</text></g>

  <path class="line amber" d="M945 168V440H327V548"/><circle cx="930" cy="440" r="10" fill="#d97706"/><text class="numText" x="930" y="444" text-anchor="middle">6</text><text class="label" x="345" y="532" fill="#9a3412">reviewed trace</text>
