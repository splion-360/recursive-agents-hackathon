  <path class="line" d="M1135 590H1170"/><circle class="num" cx="1152" cy="575" r="10"/><text class="numText" x="1152" y="579" text-anchor="middle">10</text>
  <path class="line green" d="M1380 590H1430"/><circle cx="1405" cy="575" r="10" fill="#65a30d"/><text class="numText" x="1405" y="579" text-anchor="middle">11</text>
